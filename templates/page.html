<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$name</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://vincenzoml.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --side: #f6f5f2; --fg: #1a1c1f; --muted: #646a72; --rule: #e6e3dc;
  --accent: #1b5e8c; --accent-soft: #e8f0f6; --badge-bg: #f3ead2; --badge-fg: #6b4f00;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Charter, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518; --side: #1a1d21; --fg: #e7e5e1; --muted: #9ea4ab; --rule: #2b2f35;
    --accent: #84b9de; --accent-soft: #1d2b36; --badge-bg: #3a3220; --badge-fg: #e7cf8f;
  }
}
:root[data-theme="dark"] {
  --bg: #131518; --side: #1a1d21; --fg: #e7e5e1; --muted: #9ea4ab; --rule: #2b2f35;
  --accent: #84b9de; --accent-soft: #1d2b36; --badge-bg: #3a3220; --badge-fg: #e7cf8f;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.65 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--rule); }
.side { position: sticky; top: 0; padding: 3rem 2rem 2rem; max-height: 100vh; overflow-y: auto; }
h1 { font: 600 1.9rem/1.15 var(--serif); margin: 0 0 .6rem; letter-spacing: -.01em; }
.role { margin: 0 0 .5rem; font-weight: 500; font-size: .95rem; line-height: 1.45; }
.aff { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.5; }
.aff a { color: inherit; border-bottom: 1px solid var(--rule); }
.side h2 { margin: 2rem 0 .5rem; }
.side ul { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
.side li { margin: .15rem 0; }
.side nav a { color: var(--fg); }
.side nav a:hover { color: var(--accent); }
#theme { margin-top: 2rem; font: 500 .8rem var(--sans); color: var(--muted); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .8rem; cursor: pointer; }
#theme:hover { color: var(--fg); }

main { padding: 3rem 3.5rem 2rem; max-width: 50rem; }
section { margin-bottom: 3rem; scroll-margin-top: 1.5rem; }
h2 { font: 600 .72rem/1.3 var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 1.2rem; }
main h2 { padding-bottom: .5rem; border-bottom: 1px solid var(--rule); }
h3 { font: 600 1.2rem/1.35 var(--serif); margin: 0 0 .6rem; display: flex; gap: .7rem; align-items: baseline; }
p { margin: 0 0 .9rem; }
#about p { font-size: 1.05rem; }

.problem { padding: 1.2rem 0 .4rem; border-bottom: 1px solid var(--rule); }
.problem:last-child { border-bottom: 0; }
.num { flex: none; font: 600 .75rem/1.6rem var(--sans); width: 1.6rem; height: 1.6rem; text-align: center;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent); transform: translateY(-.1rem); }
.problem dl { margin: 0 0 0 2.3rem; display: grid; grid-template-columns: 8.5rem 1fr; gap: .35rem 1rem; }
.problem dt { font: 500 .8rem/1.7 var(--sans); color: var(--muted); padding-top: .1rem; }
.problem dd { margin: 0; }
.problem .more { margin: .7rem 0 .6rem 2.3rem; font-size: .9rem; font-weight: 500; }

ul.plain, ol.pubs { list-style: none; padding: 0; margin: 0; }
ul.plain li, ol.pubs li { display: grid; grid-template-columns: 5.5rem 1fr; gap: 1rem; margin-bottom: .8rem; }
#software ul.plain li, #projects ul.plain li { display: block; }
.year { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; padding-top: .05rem; }
.pub-title { font-weight: 600; color: var(--fg); }
.pub-title:hover { color: var(--accent); }
.authors { color: var(--muted); font-size: .9rem; }
.venue { font-style: italic; font-size: .9rem; }
.badge { display: inline-block; font: 600 .68rem/1.6 var(--sans); padding: 0 .5rem; border-radius: 999px;
  background: var(--badge-bg); color: var(--badge-fg); margin-left: .5rem; vertical-align: .12em; }
.note { color: var(--muted); font-size: .88rem; }
footer { color: var(--muted); font-size: .8rem; padding-top: 1rem; border-top: 1px solid var(--rule); }

@media (max-width: 860px) {
  .layout { display: block; }
  aside { border-right: 0; border-bottom: 1px solid var(--rule); }
  .side { position: static; max-height: none; padding: 2rem 16px 1.5rem; }
  .side .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
  .side nav { display: none; }
  main { padding: 2rem 16px 1.5rem; }
  .problem dl { margin-left: 0; grid-template-columns: 1fr; gap: 0; }
  .problem dt { margin-top: .5rem; }
  .problem .more { margin-left: 0; }
  ul.plain li, ol.pubs li { grid-template-columns: 3.2rem 1fr; gap: .7rem; }
}
@media print { aside { position: static; } #theme, .side nav { display: none; } .layout { display: block; } }
</style>
<script>
try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<div class="layout">
<aside>
  <div class="side">
    <h1>$name</h1>
    <p class="role">$title</p>
    <p class="aff">$affiliation</p>
    <nav aria-label="Sections">
      <h2>On this page</h2>
      <ul>
        <li><a href="#open-problems">Open problems</a></li>
        <li><a href="#publications">Selected publications</a></li>
        <li><a href="#recognition">Recognition and service</a></li>
        <li><a href="#software">Software</a></li>
        <li><a href="#projects">Projects</a></li>
      </ul>
    </nav>
    <div class="cols">
      <div>
        <h2>Profiles</h2>
        <ul>
$links
        </ul>
      </div>
      <div>
        <h2>Contact</h2>
        <ul>
$contacts
        </ul>
      </div>
    </div>
    <button id="theme" type="button" aria-label="Toggle light/dark theme">Light / dark</button>
  </div>
</aside>
<main>
$body
<footer>Last updated: $updated</footer>
</main>
</div>
<script>
document.getElementById("theme").addEventListener("click", function () {
  var root = document.documentElement;
  var cur = root.getAttribute("data-theme");
  var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});
</script>
</body>
</html>

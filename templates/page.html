<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$name</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://vincenzoml.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #ffffff; --soft: #f5f7f9; --fg: #0f1720; --muted: #5b6672; --rule: #e5e9ee; --accent: #2457d6; --accent-soft: #eaf0fe; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c0f13; --soft: #141920; --fg: #e8ecf1; --muted: #93a0ad; --rule: #232a33; --accent: #7ea2ff; --accent-soft: #18233d; }
}
:root[data-theme="dark"] { --bg: #0c0f13; --soft: #141920; --fg: #e8ecf1; --muted: #93a0ad; --rule: #232a33; --accent: #7ea2ff; --accent-soft: #18233d; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.65 Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
.wrap { max-width: 60rem; margin: 0 auto; padding: 0 24px; }
.top { border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); z-index: 1; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 3.4rem; gap: 1rem; }
.brand { font: 600 1rem Inter Tight, Inter, sans-serif; color: var(--fg); }
.top nav { display: flex; gap: 1.3rem; font-size: .88rem; }
.top nav a { color: var(--muted); }
.top nav a:hover { color: var(--fg); text-decoration: none; }
.hero { padding-top: 4.5rem; padding-bottom: 2.5rem; }
h1 { font: 700 3rem/1.05 "Inter Tight", Inter, sans-serif; letter-spacing: -.03em; margin: 0 0 1rem; }
.role { font-size: 1.15rem; font-weight: 500; margin: 0; }
.aff { color: var(--muted); margin: .2rem 0 0; }
.aff a { color: inherit; }
.chips { list-style: none; padding: 0; margin: 1.6rem 0 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.chips a { display: inline-block; padding: .3rem .85rem; border: 1px solid var(--rule); border-radius: 999px; font-size: .85rem; font-weight: 500; color: var(--fg); }
.chips a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
section { padding: 2.2rem 0; border-top: 1px solid var(--rule); scroll-margin-top: 4rem; }
#about { border-top: 0; padding-top: 0; }
#about p { font-size: 1.15rem; line-height: 1.6; max-width: 46rem; color: var(--fg); }
h2 { font: 600 1.5rem/1.2 "Inter Tight", Inter, sans-serif; letter-spacing: -.015em; margin: 0 0 1.4rem; }
#about h2 { display: none; }
p { margin: 0 0 .9rem; }
#open-problems { display: grid; gap: 1rem; }
#open-problems h2 { grid-column: 1 / -1; margin-bottom: .4rem; }
.problem { background: var(--soft); border: 1px solid var(--rule); border-radius: 14px; padding: 1.5rem 1.8rem 1.2rem; }
h3 { font: 600 1.2rem/1.35 "Inter Tight", Inter, sans-serif; margin: 0 0 .9rem; }
.num { display: block; font-size: .75rem; font-weight: 600; color: var(--accent); letter-spacing: .08em; margin-bottom: .4rem; }
.num::before { content: "PROBLEM "; }
.problem dl { margin: 0; display: grid; grid-template-columns: 9.5rem 1fr; gap: .55rem 1.5rem; max-width: 46rem; }
.problem dt { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: .25rem; }
.problem dd { margin: 0; }
.problem .more { margin: 1rem 0 0; font-size: .88rem; font-weight: 500; }
ul.plain, ol.pubs { list-style: none; padding: 0; margin: 0; }
ul.plain li, ol.pubs li { padding: .7rem 0; border-bottom: 1px solid var(--rule); }
ul.plain li:last-child, ol.pubs li:last-child { border-bottom: 0; }
#recognition li, ol.pubs li { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; }
.year { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; font-size: .9rem; }
.pub-title { color: var(--fg); font-weight: 600; }
.pub-title:hover { color: var(--accent); }
.authors { color: var(--muted); font-size: .9rem; }
.venue { font-size: .9rem; }
.badge { display: inline-block; font-size: .7rem; font-weight: 600; padding: .05rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: .5rem; vertical-align: .1em; }
.note { color: var(--muted); font-size: .9rem; }
#software ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 0 2rem; }
footer { border-top: 1px solid var(--rule); padding: 1.5rem 0 3rem; color: var(--muted); font-size: .85rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
#theme { font: inherit; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .8rem; cursor: pointer; }
@media (max-width: 720px) {
  .wrap { padding: 0 16px; } .top nav { display: none; }
  .hero { padding-top: 2.5rem; } h1 { font-size: 2.3rem; }
  #recognition li, ol.pubs li { grid-template-columns: 3rem 1fr; gap: .7rem; }
  .problem { padding: 1.2rem 1.1rem 1rem; }
  .problem dl { grid-template-columns: 1fr; gap: 0; }
  .problem dt { margin-top: .7rem; }
}
</style>
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body>
<div class="top"><div class="wrap">
  <a class="brand" href="#">$name</a>
  <nav><a href="#open-problems">Open problems</a><a href="#publications">Publications</a><a href="#software">Software</a><a href="#projects">Projects</a></nav>
</div></div>
<header class="wrap hero">
  <h1>$name</h1>
  <p class="role">$title</p>
  <p class="aff">$affiliation</p>
  <ul class="chips">
$links
$contacts
  </ul>
</header>
<main class="wrap">
$body
</main>
<footer><div class="wrap">
  <span>Last updated: $updated</span>
  <button id="theme" type="button">Light / dark</button>
</div></footer>
<script>
document.getElementById("theme").addEventListener("click", function () {
  var r = document.documentElement, c = r.getAttribute("data-theme");
  var dark = c ? c === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("theme", dark ? "light" : "dark"); } catch (e) {}
});
</script>
</body>
</html>
